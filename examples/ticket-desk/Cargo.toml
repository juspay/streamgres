[package]
name = "streamgres-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "The ticket desk on the embedded Streamgres cache: the Diesel adapter's test bed"
publish = false

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
streamgres-diesel = { version = "0.1.0", path = "../../crates/streamgres-diesel", features = ["async"] }
diesel = { version = "2.3.8", features = ["postgres", "chrono", "r2d2"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
diesel-async = { version = "=0.7.4", features = ["postgres", "bb8"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Run independently so the showcase does not add dependencies to library builds.
[workspace]
