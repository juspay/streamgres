[package]
name = "streamgres-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A ticket desk whose reads go through an embedded Streamgres: the Diesel adapter's showcase and test bed"
publish = false

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
streamgres-diesel = { version = "0.1.0", path = "../../crates/streamgres-diesel" }
# The Postgres backend without libpq: every connection is diesel-async's.
diesel = { version = "=2.3.14", default-features = false, features = ["postgres_backend", "chrono"] }
diesel-async = { version = "=0.7.4", features = ["postgres", "bb8"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Its own workspace, so the showcase's service dependencies stay out of
# the library's builds.
[workspace]
