[package]
name = "streamgres_example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A ticket-desk backend on the Streamgres Diesel wrapper: the engine's demo, and the wrapper's test bed"
publish = false

[[bin]]
name = "example"
path = "src/main.rs"

[dependencies]
streamgres_diesel = { path = "../streamgres-diesel", features = ["async"] }
diesel = { version = "2.2.10", features = ["postgres", "r2d2", "chrono"] }
diesel-async = { version = "0.6", features = ["postgres", "bb8"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.9"
futures-util = "0.3"
