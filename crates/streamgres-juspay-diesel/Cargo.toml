[package]
name = "streamgres-juspay-diesel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "streamgres-diesel built on Juspay's Diesel fork"

# The same source as streamgres-diesel, with Juspay's fork named `diesel`.
[lib]
path = "../streamgres-diesel/src/lib.rs"

[dependencies]
streamgres = { path = "../..", default-features = false }
diesel = { package = "juspay_diesel", version = "2.3", default-features = false, features = ["postgres_backend", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
