[package]
name = "diesel-streamgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A Diesel connection wrapper serving reads from a cache the Streamgres engine keeps fresh"

[features]
default = ["diesel-2-3"]
# What only Diesel 2.3 has (`Connection::set_prepared_statement_cache_size`).
# Off, the crate builds on Diesel 2.2 as well, for an application whose
# Diesel, or a fork of it such as juspay_diesel, still builds on
# diesel_derives 2.2, which cannot share a build with 2.3's: depend with
# `default-features = false` and the build resolves Diesel 2.2.
diesel-2-3 = []
# `AsyncSyncedConnection`, the same wrapper over diesel-async's
# `AsyncPgConnection` (Diesel 2.3).
async = ["diesel-2-3", "dep:diesel-async", "diesel-async/postgres", "diesel-async/pool"]
# `sse::body`: changes as a Server-Sent Events body, a stream of text any
# web framework serves. No dependencies of its own.
sse = []
# The engine inside this process (`EngineClient::embedded`): the same
# frames as the S2S endpoint, over channels to an engine this process
# runs, instead of a socket to one elsewhere.
embedded = ["dep:streamgres"]

[dependencies]
streamgres = { path = "../..", default-features = false, optional = true }
base64 = "0.23.1"
diesel = { version = ">=2.2.12, <2.4", features = ["postgres", "r2d2", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
diesel-async = { version = "0.7", features = ["postgres"], optional = true }
futures-util = "0.3.34"
log = "0.4"
moka = { version = "0.12", features = ["sync"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
# `wss://` through rustls with the ring provider and the system's roots,
# configured per socket rather than installed for the whole process.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
chrono = "0.4.45"
scoped-futures = "0.1"
diesel = { version = "2.3.8", features = ["chrono", "postgres", "r2d2", "serde_json"] }
serde_json = "1.0.154"
