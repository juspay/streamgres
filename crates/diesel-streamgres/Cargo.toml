[package]
name = "diesel-streamgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A Diesel connection wrapper serving reads from a cache the Streamgres engine keeps fresh"

[features]
# `AsyncSyncedConnection`, the same wrapper over diesel-async's
# `AsyncPgConnection`.
async = ["dep:diesel-async", "diesel-async/postgres", "diesel-async/pool"]

[dependencies]
base64 = "0.23.1"
diesel = { version = "2.2.10", features = ["postgres", "r2d2", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
diesel-async = { version = "0.6", features = ["postgres"], optional = true }
futures-util = "0.3.34"
moka = { version = "0.12", features = ["sync"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
# `wss://` through rustls with the ring provider and the system's roots,
# configured per socket rather than installed for the whole process.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
chrono = "0.4.45"
scoped-futures = "0.1"
diesel = { version = "2.2.10", features = ["chrono", "postgres", "r2d2", "serde_json"] }
serde_json = "1.0.154"
