[package]
name = "streamgres_diesel"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
diesel = { version = "2.2.10", features = ["postgres", "r2d2", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
futures-util = "0.3.34"
moka = { version = "0.12", features = ["sync"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
chrono = "0.4.45"
diesel = { version = "2.2.10", features = ["chrono", "postgres", "r2d2", "serde_json"] }
serde_json = "1.0.154"
