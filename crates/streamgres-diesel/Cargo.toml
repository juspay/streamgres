[package]
name = "streamgres-diesel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/juspay/streamgres"
description = "Diesel queries answered by an embedded Streamgres"

[features]
default = []

[dependencies]
streamgres = { version = "0.1.0", path = "../.." }
# A cached row implements Diesel's `Row`, which needs the third-party
# backend interface.
diesel = { version = "=2.3.14", default-features = false, features = ["postgres_backend", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }

[dev-dependencies]
diesel = { version = "=2.3.14", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"
