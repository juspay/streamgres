# The whole thing on one machine: Postgres, the engine, the ticket desk.
#
#   docker compose -f demo/docker-compose.yml up --build
#
# Then http://localhost:8080 for the stats page, and demo/README.md for
# the curl walk-through. Every port is published on this machine only,
# and the engine's S2S endpoint asks for a token: the stack holds a
# well-known database password and is for a laptop, not a network.
services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      # A slot left by an engine that crashed (rather than stopped)
      # holds WAL until it is dropped; this caps what it can hold, as
      # docs/deploy.md advises, so a crash cannot fill the disk.
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: streamgres
      POSTGRES_PASSWORD: streamgres
      POSTGRES_DB: tickets
    volumes:
      # The publication the engine streams, then the schema-change
      # trigger stack it requires, both for app `demo`, shard 0.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-publication.sql:ro
      - ./ddl-triggers.sql:/docker-entrypoint-initdb.d/20-ddl-triggers.sql:ro
    ports:
      # Host ports are overridable, for a machine that already has one
      # of these services on the default port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamgres -d tickets"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates the schema and loads the dataset, then exits. Runs before
  # the engine so the tables are there when it takes its snapshot.
  seed:
    build:
      context: ..
      dockerfile: docker/demo/Dockerfile
    command: ["seed"]
    environment:
      DATABASE_URL: postgres://streamgres:streamgres@postgres:5432/tickets
      DEMO_SCALE: "${DEMO_SCALE:-1}"
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    environment:
      STREAMGRES_PG_DSN: postgresql://streamgres:streamgres@postgres:5432/tickets
      # The app the trigger stack and the publication are made for.
      STREAMGRES_APP_ID: demo
      STREAMGRES_PUBLICATION: demo_pub
      STREAMGRES_S2S_TOKEN: "${STREAMGRES_S2S_TOKEN:-demo-token-not-for-production}"
      # The Zero side is not part of this demo; the endpoints are never
      # called, but the server wants them set.
      STREAMGRES_QUERY_URL: http://127.0.0.1:1/query
      STREAMGRES_MUTATE_URL: http://127.0.0.1:1/mutate
      STREAMGRES_ADDR: 0.0.0.0:4848
    ports:
      - "127.0.0.1:${ENGINE_PORT:-4848}:4848"
    # A migration the engine cannot follow (`demo migrate drop`)
    # stops it on purpose; restarted, it serves the schema as it is.
    restart: on-failure
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4848/health"]
      interval: 2s
      timeout: 2s
      retries: 60

  demo:
    build:
      context: ..
      dockerfile: docker/demo/Dockerfile
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://streamgres:streamgres@postgres:5432/tickets
      STREAMGRES_S2S_URL: ws://engine:4848/zero/s2s/v1
      STREAMGRES_S2S_TOKEN: "${STREAMGRES_S2S_TOKEN:-demo-token-not-for-production}"
      DEMO_ADDR: 0.0.0.0:8080
      DEMO_WRITER_MS: "${DEMO_WRITER_MS:-1000}"
      DEMO_WRITER_MIX: "${DEMO_WRITER_MIX:-}"
      DEMO_VERIFY_MS: "${DEMO_VERIFY_MS:-0}"
      DEMO_SCALE: "${DEMO_SCALE:-1}"
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    depends_on:
      engine:
        condition: service_healthy
